services:
  db:
    # Host port only. Postgres inside the container still listens on 5432.
    ports:
      - '${DEV_DB_PORT:-5433}:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # !override replaces the base 3000:3000 publish. Nuxt inside the container still listens on 3000.
    ports: !override
      - '${DEV_APP_PORT:-3010}:3000'
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-werkscode}:${POSTGRES_PASSWORD:-werkscode}@db:5432/${POSTGRES_DB:-werkscode}
      NUXT_DATABASE_URL: postgresql://${POSTGRES_USER:-werkscode}:${POSTGRES_PASSWORD:-werkscode}@db:5432/${POSTGRES_DB:-werkscode}
      NUXT_PUBLIC_APP_URL: http://localhost:${DEV_APP_PORT:-3010}
    volumes:
      - .:/app
      - /app/node_modules
      # Keep @nuxt/content SQLite cache in a container volume (not the bind mount).
      # Avoids root-owned .data on the host and stale/partial content indexes.
      - nuxt_content_cache:/app/.data
    command: ['./scripts/docker-dev-entrypoint.sh']

volumes:
  postgres_dev_data:
  nuxt_content_cache:
